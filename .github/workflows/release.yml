name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - run: bun install --frozen-lockfile
      - name: Tag and app version must agree
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APP_VERSION="v$(node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version")"
          test "$TAG" = "$APP_VERSION" || { echo "tag $TAG != app $APP_VERSION"; exit 1; }
      - name: Signing secrets must be present
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1; }
          test -n "$PASSWORD" || { echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing"; exit 1; }
      - name: Build web UI and stage desktop resources
        run: |
          bun run build:web
          bun run --cwd packages/desktop build
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_BUNDLE_SIGNING_IDENTITY: ${{ secrets.TAURI_BUNDLE_SIGNING_IDENTITY }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Spleen ${{ github.event.inputs.tag || github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

# Owner actions before the first release:
# 1. Generate the updater keypair, put the public key in tauri.conf.json, and
#    store the private key + password as the two TAURI_SIGNING_* secrets.
# 2. Provide a Windows code-signing certificate and its identity; remove the
#    guard step only when those secrets exist.
# 3. Create the `release` environment with required reviewers.
