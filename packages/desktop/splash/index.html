<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spleen</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0a0d10;
        color: #e8e4dc;
        font-family: "Segoe UI", system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #1e242b;
        border-radius: 10px;
        overflow: hidden;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .mark { width: 56px; height: 56px; }
      .name { font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: #f3efe7; }
      .state { font-size: 12px; color: #8b949e; letter-spacing: 0.04em; }
      .bar { width: 132px; height: 2px; background: #1b2128; overflow: hidden; border-radius: 2px; }
      .bar span { display: block; width: 40%; height: 100%; background: #d9503f; animation: slide 1.15s ease-in-out infinite; }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 9c11 0 19 7.4 19 17.2 0 6.1-3.4 9.9-8.5 12.1L32 43.6 21.5 38.3C16.4 36.1 13 32.3 13 26.2 13 16.4 21 9 32 9Z" fill="#d9503f" opacity=".92"/>
        <path d="M32 26c7.4 0 12.6 4.6 12.6 10.8 0 6.2-5.2 10.8-12.6 10.8s-12.6-4.6-12.6-10.8C19.4 30.6 24.6 26 32 26Z" fill="#f3efe7" opacity=".14"/>
        <path d="M32 33.5v14" stroke="#0a0d10" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div class="name">Spleen</div>
      <div class="bar"><span></span></div>
      <div class="state" id="state">Starting the local engine</div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const message = params.get('message');
      if (message) document.getElementById('state').textContent = message;
    </script>
  </body>
</html>
